name: ITDOApp
options:
  bundleIdPrefix: ru.bleyzos.itdo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 5
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ITDOApp:
    type: application
    platform: iOS
    sources:
      - path: ITDOApp
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
      - target: ITDOAppWidget
        embed: true
    info:
      path: ITDOApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: ITDO
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: ru.bleyzos.itdo.app
            CFBundleURLSchemes:
              - itdo
        NSAppTransportSecurity:
          NSExceptionDomains:
            itdo.bleyzos.ru:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
        NSMicrophoneUsageDescription: "Нужен для записи голосовых сообщений"
        NSPhotoLibraryUsageDescription: "Нужна для прикрепления фото к сообщениям и постам"
        NSCameraUsageDescription: "Нужна для съёмки фото и видео"
        NSFaceIDUsageDescription: "Используется как быстрая альтернатива вводу код-пароля приложения"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.bleyzos.itdo.app
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: ITDOApp/ITDOApp.entitlements

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.bleyzos.itdo.app.share
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES

  ITDOAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ITDOAppWidget
      - path: Shared
    info:
      path: ITDOAppWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.bleyzos.itdo.app.widget
        PRODUCT_NAME: ITDOAppWidget
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ITDOAppWidget/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: ITDOAppWidget/ITDOAppWidget.entitlements
        SKIP_INSTALL: YES
